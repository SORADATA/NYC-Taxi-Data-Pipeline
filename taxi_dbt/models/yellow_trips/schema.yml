version: 2

models:
  - name: stg_trip
    description: "Données nettoyées et standardisées des trajets de yellow taxi de NYC."
    
    columns:
      - name: pickup_datetime
        description: "Date et heure de prise en charge du passager."
        data_tests:
          - not_null

      - name: dropoff_datetime
        description: "Date et heure de dépose du passager."
        data_tests:
          - not_null

      - name: trip_distance
        description: "Distance totale du trajet en miles."
        data_tests:
          - not_null

      - name: total_amount
        description: "Montant total payé pour la course."
        data_tests:
          - not_null